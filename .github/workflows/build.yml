name: Build libcheat.dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20 # Если за 20 минут не соберется - отменится сама
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build libcheat.dylib
        run: bash scripts/build.sh

      - name: Verify dylib
        run: |
          echo "=== file ==="
          file build/libcheat.dylib
          echo "=== linked libraries ==="
          otool -L build/libcheat.dylib
          echo "=== LC_ID_DYLIB ==="
          otool -l build/libcheat.dylib | grep -A2 LC_ID_DYLIB

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcheat-dylib
          path: build/libcheat.dylib
